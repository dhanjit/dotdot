<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotDot</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="game-container">
        <header>
            <h1>DotDot</h1>
            <div class="status-bar">
                <div class="player-score" id="p1-score">P1: 0</div>
                <div class="turn-indicator" id="turn-indicator">Player 1's Turn</div>
                <div class="player-score" id="p2-score">P2: 0</div>
            </div>
            <div id="game-message" class="message"></div>
        </header>

        <main>
            <div id="game-board" class="paper-bg">
                <!-- SVG Grid will be injected here -->
            </div>
        </main>

        <footer>
            <div class="game-options">
                <div class="option-group">
                    <label for="game-mode">Mode:</label>
                    <select id="game-mode">
                        <option value="pvp">Player vs Player</option>
                        <option value="pvc">Player vs Computer</option>
                    </select>
                </div>
                <div class="option-group" id="difficulty-group" style="display: none;">
                    <label for="ai-difficulty">Difficulty:</label>
                    <select id="ai-difficulty">
                        <option value="greedy">Greedy (Standard)</option>
                        <option value="strategic">Strategic (Hard)</option>
                    </select>
                </div>
            </div>

            <button id="restart-btn">Restart Game</button>
            <div class="controls">
                <div class="input-group">
                    <label for="grid-rows">Rows:</label>
                    <input type="number" id="grid-rows" min="3" max="50" value="10">
                </div>
                <span class="x-separator">x</span>
                <div class="input-group">
                    <label for="grid-cols">Cols:</label>
                    <input type="number" id="grid-cols" min="3" max="50" value="10">
                </div>
            </div>
            <div id="ai-status" class="hidden">Computer is thinking...</div>
        </footer>
    </div>

    <script src="js/game.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
