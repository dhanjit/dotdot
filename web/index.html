<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotDot</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="game-container">
        <header>
            <h1>DotDot</h1>
            <div class="status-bar">
                <div class="player-score" id="p1-score">P1: 0</div>
                <div class="turn-indicator" id="turn-indicator">Player 1's Turn</div>
                <div class="player-score" id="p2-score">P2: 0</div>
            </div>
            <div id="game-message" class="message"></div>
        </header>

        <main>
            <div id="game-board" class="paper-bg">
                <!-- SVG Grid will be injected here -->
            </div>
        </main>

        <footer>
            <button id="restart-btn">Restart Game</button>
            <div class="controls">
                <label for="grid-size">Grid Size:</label>
                <select id="grid-size">
                    <option value="5">5x5</option>
                    <option value="10" selected>10x10</option>
                    <option value="15">15x15</option>
                    <option value="20">20x20</option>
                    <option value="30">30x30</option>
                </select>
            </div>
        </footer>
    </div>

    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
